<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECROGRAD</title>

    <style>
        @font-face {
            font-family: 'Kenyan Coffee';
            src: url('./kenyan-coffee.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kenyan Coffee', sans-serif;
            background: #050810;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Черные прямоугольники сверху и снизу (кинематографичные рамки) */
        .top-bar, .bottom-bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 80px; /* Высота рамок */
            background-color: #000000;
            z-index: 10;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.95);
        }

        .top-bar {
            top: 0;
            border-bottom: 1px solid rgba(77, 138, 255, 0.08); /* Тонкая неоновая линия под цвет логотипа */
        }

        .bottom-bar {
            bottom: 0;
            border-top: 1px solid rgba(77, 138, 255, 0.08);
            display: flex;
            align-items: center;
            padding-left: 30px; /* Отступ кружка от левого края */
        }

        /* Светящийся крутящийся кружок */
        .spinning-circle {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #4d8aff; /* Сине-голубой цвет под свечение логотипа */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 8px rgba(77, 138, 255, 0.8));
        }

        /* Анимация кружения */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Задний фон (GIF) */
        .gif-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            transform: scale(1.05);
        }

        .gif-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) contrast(1.15) saturate(0.85);
        }

        .gif-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.35) 100%),
                rgba(5, 8, 16, 0.12);
            pointer-events: none;
        }

        /* Главный контейнер с логотипом */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 300px;
            background: radial-gradient(
                ellipse,
                rgba(77, 138, 255, 0.18) 0%,
                rgba(77, 138, 255, 0.08) 35%,
                transparent 75%
            );
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 120px;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
        }

        .logo-text {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, #d9deea 45%, #8b93ac 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 24px rgba(77, 138, 255, 0.25));
        }

        /* Адаптация под мобильные устройства и разные экраны */
        @media (max-width: 768px) {
            .top-bar, .bottom-bar {
                height: 60px;
            }
            .bottom-bar {
                padding-left: 20px;
            }
            .spinning-circle {
                width: 22px;
                height: 22px;
                border-width: 2px;
            }
            .logo {
                font-size: 58px;
                letter-spacing: 5px;
            }
            .logo-glow {
                width: 320px;
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 36px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Тег аудио для музыки -->
    <audio id="bg-music" autoplay loop preload="auto">
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <!-- Верхний прямоугольник -->
    <div class="top-bar"></div>

    <!-- Нижний прямоугольник с крутящимся кругом внутри -->
    <div class="bottom-bar">
        <div class="spinning-circle"></div>
    </div>

    <!-- Задний фон -->
    <div class="gif-background">
        <img src="./background.gif" alt="background">
    </div>

    <!-- Логотип -->
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo">
                <span class="logo-text">hecrograd</span>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        
        // Установи громкость (от 0.0 до 1.0)
        let targetVolume = 0.4; 
        music.volume = targetVolume;

        // Функция принудительного запуска воспроизведения
        function playMusic() {
            if (music.paused) {
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) {
                        console.log("Ожидание активности для запуска музыки...");
                    });
                }
            }
        }

        // =========================================================
        // ИНТЕГРАЦИЯ С ДВИЖКОМ GARRYS MOD (CEF Chromium)
        // Эти функции автоматически вызываются игрой при загрузке
        // =========================================================
        
        // Вызывается в самом начале подключения к серверу
        window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
            // Если в настройках GMod у игрока убавлен звук, подстраиваемся под него
            if (volume !== undefined && volume > 0) {
                music.volume = volume;
            } else {
                music.volume = targetVolume;
            }
            playMusic();
        };

        // Вызывается при скачивании файлов аддонов/карты
        window.DownloadingFile = function(fileName) {
            playMusic();
        };

        // Вызывается при изменении статуса загрузки (например, "Sending client info...")
        window.SetStatusChanged = function(status) {
            playMusic();
        };

        // Циклическая проверка для обхода блокировки звука браузером
        window.addEventListener('load', function() {
            playMusic();
            const forcePlayInterval = setInterval(function() {
                if (!music.paused) {
                    clearInterval(forcePlayInterval); // Если музыка успешно заиграла, выключаем цикл
                } else {
                    playMusic(); // Пробуем запустить снова
                }
            }, 200);
        });

        // Резервные триггеры на случай запуска в обычном браузере
        document.addEventListener('click', playMusic, { once: true });
        document.addEventListener('mousemove', playMusic, { once: true });
        document.addEventListener('keydown', playMusic, { once: true });
    </script>
</body>
</html>
