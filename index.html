<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECROGRAD</title>

    <style>
        @font-face {
            font-family: 'Kenyan Coffee';
            src: url('./kenyan-coffee.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kenyan Coffee', sans-serif;
            background: #050810;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .gif-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            transform: scale(1.05);
        }

        .gif-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) contrast(1.15) saturate(0.85);
        }

        .gif-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.35) 100%),
                rgba(5, 8, 16, 0.12);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 300px;
            background: radial-gradient(
                ellipse,
                rgba(77, 138, 255, 0.18) 0%,
                rgba(77, 138, 255, 0.08) 35%,
                transparent 75%
            );
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 120px;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
        }

        .logo-text {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, #d9deea 45%, #8b93ac 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 24px rgba(77, 138, 255, 0.25));
        }

        /* ===== CLICK TO PLAY OVERLAY ===== */
        .click-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(5, 8, 16, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .click-overlay span {
            font-family: 'Kenyan Coffee', sans-serif;
            font-size: 32px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            animation: pulse 2s ease-in-out infinite;
        }

        .click-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 58px;
                letter-spacing: 5px;
            }

            .logo-glow {
                width: 320px;
                height: 180px;
            }

            .click-overlay span {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 36px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- CLICK TO START (browsers block autoplay without interaction) -->
    <div class="click-overlay" id="click-overlay">
        <span>click to enter</span>
    </div>

    <!-- MUSIC -->
    <audio id="bg-music" loop preload="auto">
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <!-- GIF BACKGROUND -->
    <div class="gif-background">
        <img src="./background.gif" alt="background">
    </div>

    <!-- LOGO -->
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo">
                <span class="logo-text">hecrograd</span>
            </div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('click-overlay');
        const music = document.getElementById('bg-music');
        music.volume = 0.5;

        // Browsers block autoplay without user interaction
        // So we show "click to enter" overlay
        overlay.addEventListener('click', () => {
            music.play();
            overlay.classList.add('hidden');
        });

        // Also try autoplay on any first interaction
        document.addEventListener('keydown', () => {
            if (music.paused) {
                music.play();
                overlay.classList.add('hidden');
            }
        }, { once: true });
    </script>
</body>
</html>
