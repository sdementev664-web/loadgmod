<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECROGRAD</title>

    <style>
        @font-face {
            font-family: 'Kenyan Coffee';
            src: url('Kenyan Coffee Rg.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-darker: #050810;
            --text-primary: #ffffff;
            --glow-blue: rgba(77, 138, 255, 0.45);
        }

        body {
            font-family: 'Kenyan Coffee', sans-serif;
            background: var(--bg-darker);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ===== GIF BACKGROUND ===== */
        .gif-background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            transform: scale(1.05);
        }

        .gif-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) contrast(1.15) saturate(0.85);
        }

        .gif-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.35) 100%),
                rgba(5, 8, 16, 0.12);
            pointer-events: none;
        }

        /* ===== CONTENT ===== */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 300px;
            background: radial-gradient(
                ellipse,
                rgba(77, 138, 255, 0.18) 0%,
                rgba(77, 138, 255, 0.08) 35%,
                transparent 75%
            );
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 120px;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
        }

        .logo-text {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, #d9deea 45%, #8b93ac 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 24px rgba(77, 138, 255, 0.25));
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 58px;
                letter-spacing: 5px;
            }

            .logo-glow {
                width: 320px;
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 36px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- MUSIC -->
    <audio id="bg-music" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- GIF BACKGROUND -->
    <div class="gif-background">
        <img src="background.gif" alt="background">
    </div>

    <!-- LOGO -->
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo">
                <span class="logo-text">hecrograd</span>
            </div>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.5;

        window.addEventListener('load', () => {
            bgMusic.play().catch(() => {});
        });
    </script>
</body>
</html>
