<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECROGRAD</title>
    <style>
        @font-face {
            font-family: 'VCR OSD Mono';
            src: url('VCR_OSD_MONO.ttf') format('truetype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent-blue: #4d8aff;
            --bg-darker: #050810;
            --glow-blue: rgba(77, 138, 255, 0.6);
        }

        body {
            font-family: 'VCR OSD Mono', monospace;
            background: var(--bg-darker);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* ====== GIF FULLSCREEN ====== */
        .gif-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            will-change: transform;
        }

        .gif-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.2) contrast(1.4) saturate(0.5);
            will-change: filter;
        }

        .gif-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%),
                rgba(5, 8, 16, 0.35);
            pointer-events: none;
        }

        /* ====== PARTICLES ====== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ====== CLICK OVERLAY ====== */
        .click-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        .click-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .click-icon {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(77, 138, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: clickPulse 2s infinite;
        }

        .click-icon svg { fill: var(--accent-blue); width: 24px; height: 24px; }

        @keyframes clickPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(77, 138, 255, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(77, 138, 255, 0.5); transform: scale(1.05); }
        }

        .click-text {
            font-size: 14px;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        /* ====== VOLUME ====== */
        .volume-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .volume-control.visible { opacity: 1; }

        .volume-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(77, 138, 255, 0.3);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .volume-btn:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(77, 138, 255, 0.3);
        }

        .volume-btn svg { fill: rgba(255, 255, 255, 0.6); width: 16px; height: 16px; }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--glow-blue);
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px var(--glow-blue);
            border: none;
        }

        /* ====== CONTENT ====== */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
            padding: 40px;
        }

        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ====== LOGO ====== */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            will-change: transform;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(
                ellipse,
                rgba(77, 138, 255, 0.15) 0%,
                rgba(168, 85, 247, 0.06) 40%,
                transparent 70%
            );
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
            will-change: opacity;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 120px;
            letter-spacing: 14px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
            will-change: transform;
        }

        .logo-text {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, #c8cdd8 45%, #8a92aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(77, 138, 255, 0.3));
        }

        /* ====== LOADING ====== */
        .footer {
            width: 100%;
            max-width: 700px;
        }

        .loading-section {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 20px 24px;
            border-radius: 8px;
            border: 1px solid rgba(77, 138, 255, 0.4);
            box-shadow:
                0 0 20px rgba(77, 138, 255, 0.2),
                0 0 40px rgba(77, 138, 255, 0.1),
                inset 0 0 12px rgba(77, 138, 255, 0.06);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from {
                box-shadow:
                    0 0 20px rgba(77, 138, 255, 0.2),
                    0 0 40px rgba(77, 138, 255, 0.1),
                    inset 0 0 12px rgba(77, 138, 255, 0.06);
                border-color: rgba(77, 138, 255, 0.4);
            }
            to {
                box-shadow:
                    0 0 35px rgba(77, 138, 255, 0.45),
                    0 0 70px rgba(77, 138, 255, 0.2),
                    inset 0 0 20px rgba(77, 138, 255, 0.12);
                border-color: rgba(77, 138, 255, 0.7);
            }
        }

        .loading-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .loading-label {
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .loading-percentage {
            font-size: 26px;
            color: var(--accent-blue);
            text-shadow: 0 0 20px var(--glow-blue);
            min-width: 70px;
            text-align: right;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff8c00, #ff4655, #a855f7, #4d8aff, #00ff88);
            background-size: 300% 100%;
            animation: progressColorShift 4s linear infinite;
            border-radius: 2px;
            position: relative;
            transition: width 0.3s ease;
        }

        @keyframes progressColorShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .progress-glow {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7));
            animation: progressShine 1.5s infinite;
        }

        @keyframes progressShine {
            0% { opacity: 0; transform: translateX(-60px); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(30px); }
        }

        .loading-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .loading-status {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .loading-spinner { display: flex; gap: 4px; }

        .spinner-dot {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--accent-blue);
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        .spinner-dot:nth-child(2) { animation-delay: 0.2s; }
        .spinner-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* beat-hit class для вспышки */
        .logo-wrapper.beat-hit .logo-glow {
            opacity: 0.75 !important;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            .logo { font-size: 56px; letter-spacing: 8px; }
            .container { gap: 40px; padding: 20px; }
        }

        @media (max-width: 480px) {
            .logo { font-size: 36px; letter-spacing: 4px; }
            .loading-percentage { font-size: 18px; }
            .click-icon { width: 50px; height: 50px; }
            .click-text { font-size: 11px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <!-- AUDIO -->
    <audio id="bg-music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- CLICK TO START -->
    <div class="click-overlay" id="clickOverlay">
        <div class="click-icon">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
        <div class="click-text">click to enter</div>
    </div>

    <!-- GIF BACKGROUND -->
    <div class="gif-background" id="gif-bg-wrap">
        <img id="gif-bg" src="background.gif" alt="bg">
    </div>

    <!-- PARTICLES -->
    <canvas id="particles"></canvas>

    <!-- VOLUME -->
    <div class="volume-control" id="volumeControl">
        <button class="volume-btn" id="volumeBtn">
            <svg id="volIcon" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
    </div>

    <!-- CONTENT -->
    <div class="container">
        <div class="main-content">
            <div class="logo-wrapper" id="logo-wrapper">
                <div class="logo-glow"></div>
                <div class="logo">
                    <span class="logo-text">hecrograd</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="loading-section">
                <div class="loading-top">
                    <div class="loading-label" id="loading-label">loading</div>
                    <div class="loading-percentage" id="loading-percent">0%</div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-glow"></div>
                    </div>
                </div>
                <div class="loading-bottom">
                    <div class="loading-status" id="loading-status">initializing</div>
                    <div class="loading-spinner">
                        <div class="spinner-dot"></div>
                        <div class="spinner-dot"></div>
                        <div class="spinner-dot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ ELEMENTS ============
        const overlay = document.getElementById('clickOverlay');
        const bgMusic = document.getElementById('bg-music');
        const volumeControl = document.getElementById('volumeControl');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volIcon = document.getElementById('volIcon');
        const logoWrapper = document.getElementById('logo-wrapper');
        const logo = logoWrapper.querySelector('.logo');
        const glowEl = logoWrapper.querySelector('.logo-glow');
        const gifBgWrap = document.getElementById('gif-bg-wrap');
        const gifImg = document.getElementById('gif-bg');
        const loadingPercent = document.getElementById('loading-percent');
        const progressBar = document.getElementById('progress-bar');
        const loadingLabel = document.getElementById('loading-label');
        const loadingStatus = document.getElementById('loading-status');

        let muted = false;
        let started = false;

        // ============ CLICK TO START ============
        overlay.addEventListener('click', () => {
            if (started) return;
            started = true;

            overlay.classList.add('hidden');
            bgMusic.volume = volumeSlider.value / 100;
            bgMusic.play().catch(() => {});
            volumeControl.classList.add('visible');

            setTimeout(() => {
                startLoading();
                beatLoop();
            }, 400);
        });

        // ============ VOLUME ============
        volumeSlider.addEventListener('input', () => {
            bgMusic.volume = volumeSlider.value / 100;
            muted = false;
            bgMusic.muted = false;
            updateVolIcon();
        });

        volumeBtn.addEventListener('click', () => {
            muted = !muted;
            bgMusic.muted = muted;
            updateVolIcon();
        });

        function updateVolIcon() {
            if (muted || bgMusic.volume === 0) {
                volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else {
                volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            }
        }

        // ============ PARTICLES ============
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: -1000, y: -1000 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.4 + 0.1;
                this._currentOpacity = this.opacity;
                this.color = Math.random() > 0.7 ? '#4d8aff' : (Math.random() > 0.5 ? '#ff4655' : '#ffffff');
                this.pulse = Math.random() * Math.PI * 2;
                this.pulseSpeed = Math.random() * 0.02 + 0.008;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.pulse += this.pulseSpeed;
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const force = (120 - dist) / 120;
                    this.x += (dx / dist) * force * 1.5;
                    this.y += (dy / dist) * force * 1.5;
                    this._currentOpacity += (0.8 - this._currentOpacity) * 0.1;
                } else {
                    this._currentOpacity += (this.opacity - this._currentOpacity) * 0.05;
                }
                if (this.x < -10) this.x = canvas.width + 10;
                if (this.x > canvas.width + 10) this.x = -10;
                if (this.y < -10) this.y = canvas.height + 10;
                if (this.y > canvas.height + 10) this.y = -10;
            }
            draw() {
                const o = this._currentOpacity * (0.7 + Math.sin(this.pulse) * 0.3);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = o;
                ctx.fill();
                if (this.size > 1.5) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.globalAlpha = o * 0.12;
                    ctx.fill();
                }
            }
        }

        const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 14000));
        for (let i = 0; i < count; i++) particles.push(new Particle());

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = '#4d8aff';
                        ctx.globalAlpha = (1 - dist / 100) * 0.1;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            drawConnections();
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ============ BEAT SYSTEM ============
        const beatDuration = 300;
        const beatPause = 200;
        let gridDirection = 0;
        let logoBeatActive = false;
        let gifBeatActive = false;

        function doLogoBeat() {
            if (logoBeatActive) return;
            logoBeatActive = true;
            logoWrapper.classList.add('beat-hit');
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / beatDuration, 1);
                let ease = t < 0.4 ? t / 0.4 : 1 - ((t - 0.4) / 0.6);
                const moveY = 18 * ease;
                const scaleVal = 1 + 0.06 * ease;
                logo.style.transform = `translateY(${moveY}px) scale(${scaleVal})`;
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    logo.style.transform = 'translateY(0px) scale(1)';
                    logoWrapper.classList.remove('beat-hit');
                    logoBeatActive = false;
                }
            }
            requestAnimationFrame(animate);
        }

        function doGifBeat() {
            if (gifBeatActive) return;
            gifBeatActive = true;
            const dir = gridDirection === 0 ? 1 : -1;
            gridDirection = gridDirection === 0 ? 1 : 0;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / beatDuration, 1);
                let ease = t < 0.4 ? t / 0.4 : 1 - ((t - 0.4) / 0.6);
                const rotateY = dir * 3 * ease;
                const rotateX = 2 * ease;
                const scaleGif = 1.05 + 0.03 * ease;
                const brightness = 0.2 + 0.08 * ease;
                gifBgWrap.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scaleGif})`;
                gifImg.style.filter = `brightness(${brightness}) contrast(1.4) saturate(0.5)`;
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    gifBgWrap.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale(1.05)';
                    gifImg.style.filter = 'brightness(0.2) contrast(1.4) saturate(0.5)';
                    gifBeatActive = false;
                }
            }
            requestAnimationFrame(animate);
        }

        function pulseEffects() {
            if (glowEl) {
                glowEl.style.transition = 'none';
                glowEl.style.opacity = '0.75';
                setTimeout(() => {
                    glowEl.style.transition = 'opacity 0.4s ease';
                    glowEl.style.opacity = '0.35';
                }, 60);
            }
        }

        function beatLoop() {
            doLogoBeat();
            doGifBeat();
            pulseEffects();
            setTimeout(beatLoop, beatDuration + beatPause);
        }

        // ============ LOADING ============
        const statuses = [
            { at: 0, text: "initializing" },
            { at: 15, text: "loading assets" },
            { at: 30, text: "connecting" },
            { at: 50, text: "syncing data" },
            { at: 70, text: "preparing ui" },
            { at: 85, text: "finalizing" },
            { at: 95, text: "almost done" },
            { at: 100, text: "complete" }
        ];

        let currentProgress = 0;
        let targetProgress = 0;

        function startLoading() {
            function tick() {
                if (targetProgress < 100) {
                    targetProgress = Math.min(100, targetProgress + Math.random() * 1.8 + 0.3);
                }
                currentProgress += (targetProgress - currentProgress) * 0.06;
                const display = Math.min(Math.round(currentProgress), 100);

                loadingPercent.textContent = display + '%';
                progressBar.style.width = display + '%';

                // Update status
                for (let i = statuses.length - 1; i >= 0; i--) {
                    if (display >= statuses[i].at) {
                        loadingStatus.textContent = statuses[i].text;
                        break;
                    }
                }

                if (display < 100) {
                    setTimeout(tick, 50);
                } else {
                    loadingPercent.textContent = '100%';
                    loadingPercent.style.color = '#00ff88';
                    loadingPercent.style.textShadow = '0 0 20px rgba(0, 255, 136, 0.6)';
                    loadingLabel.textContent = 'COMPLETE';
                    loadingStatus.textContent = 'ready';
                }
            }
            setTimeout(tick, 800);
        }
    </script>
</body>
</html>
