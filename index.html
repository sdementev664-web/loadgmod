<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECROGRAD</title>

    <style>
        @font-face {
            font-family: 'Kenyan Coffee';
            src: url('./kenyan-coffee.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kenyan Coffee', sans-serif;
            background: #050810;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Черные прямоугольники (плашки) сверху и снизу */
        .top-bar, .bottom-bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #000000;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .top-bar {
            top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bottom-bar {
            bottom: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            padding-left: 30px;
        }

        /* Крутящийся кружок */
        .spinning-circle {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #4d8aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(77, 138, 255, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .gif-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            transform: scale(1.05);
        }

        .gif-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) contrast(1.15) saturate(0.85);
        }

        .gif-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.35) 100%),
                rgba(5, 8, 16, 0.12);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 300px;
            background: radial-gradient(
                ellipse,
                rgba(77, 138, 255, 0.18) 0%,
                rgba(77, 138, 255, 0.08) 35%,
                transparent 75%
            );
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 120px;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
        }

        .logo-text {
            display: inline-block;
            background: linear-gradient(180deg, #ffffff 0%, #d9deea 45%, #8b93ac 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 24px rgba(77, 138, 255, 0.25));
        }

        @media (max-width: 768px) {
            .top-bar, .bottom-bar { height: 60px; }
            .bottom-bar { padding-left: 20px; }
            .spinning-circle { width: 22px; height: 22px; border-width: 2px; }
            .logo { font-size: 58px; letter-spacing: 5px; }
            .logo-glow { width: 320px; height: 180px; }
        }

        @media (max-width: 480px) {
            .logo { font-size: 36px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <!-- Тег audio настроен под автозапуск -->
    <audio id="bg-music" autoplay loop preload="auto">
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <div class="top-bar"></div>

    <div class="bottom-bar">
        <div class="spinning-circle"></div>
    </div>

    <div class="gif-background">
        <img src="./background.gif" alt="background">
    </div>

    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo">
                <span class="logo-text">hecrograd</span>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        let defaultVolume = 0.4; // Громкость по умолчанию (от 0.0 до 1.0)
        music.volume = defaultVolume;

        function playMusic() {
            if (music.paused) {
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) {
                        console.log("Ожидание сигнала от GMod для запуска звука...");
                    });
                }
            }
        }

        // --- СПЕЦИАЛЬНЫЕ ФУНКЦИИ ДЛЯ GARRY'S MOD ---
        // GMod автоматически вызывает GameDetails при подключении к серверу
        window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
            if (volume && volume > 0) {
                music.volume = volume; // Устанавливает громкость из настроек GMod игрока
            }
            playMusic();
        };

        // Вызывается при загрузке файлов карты
        window.DownloadingFile = function(fileName) {
            playMusic();
        };

        // Вызывается при изменении статуса загрузки
        window.SetStatusChanged = function(status) {
            playMusic();
        };

        // Запуск при открытии страницы и повторные попытки (если браузер блокировал)
        window.addEventListener('load', function() {
            playMusic();
            const autoPlayInterval = setInterval(function() {
                if (!music.paused) {
                    clearInterval(autoPlayInterval);
                } else {
                    playMusic();
                }
            }, 250);
        });

        // Резервный вариант на случай тестирования через обычный браузер
        document.addEventListener('click', playMusic);
        document.addEventListener('mousemove', playMusic);
        document.addEventListener('keydown', playMusic);
    </script>
</body>
</html>
