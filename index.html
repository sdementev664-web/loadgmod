<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECROGRAD</title>

    <style>
        @font-face {
            font-family: 'VCR OSD Mono';
            src: url('VCR_OSD_MONO.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-darker: #050810;
            --text-primary: #ffffff;
            --glow-blue: rgba(77, 138, 255, 0.5);
        }

        body {
            font-family: 'VCR OSD Mono', monospace;
            background: var(--bg-darker);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ===== GIF BACKGROUND FULLSCREEN ===== */
        .gif-background {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

        .gif-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55) contrast(1.15) saturate(0.85);
        }

        /* Лёгкое затемнение, чтобы текст читался */
        .gif-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 16, 0.18);
            pointer-events: none;
        }

        /* ===== CONTENT ===== */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 120px;
            letter-spacing: 14px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
            text-shadow: 0 0 25px var(--glow-blue);
            animation: logoPulse 3s ease-in-out infinite;
        }

        .logo-text {
            background: linear-gradient(180deg, #ffffff 0%, #d9deea 45%, #8b93ac 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(77, 138, 255, 0.15));
            }
            50% {
                transform: scale(1.02);
                filter: drop-shadow(0 0 35px rgba(77, 138, 255, 0.35));
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 58px;
                letter-spacing: 8px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 36px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- MUSIC -->
    <audio id="bg-music" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- GIF BACKGROUND -->
    <div class="gif-background">
        <img src="background.gif" alt="background">
    </div>

    <!-- LOGO -->
    <div class="container">
        <div class="logo">
            <span class="logo-text">hecrograd</span>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.5;

        window.addEventListener('load', () => {
            bgMusic.play().catch(() => {});
        });
    </script>
</body>
</html>
